name: Ingest

# Triggers the Pulse ATL ingest by calling the deployed service's admin endpoint.
#
# Why it works this way: the pipeline used to run here, on the runner. It cannot.
# External TLS connections to the Render Postgres instance are terminated for
# everything outside the service — six client configurations were probed and all
# failed, while a no-TLS attempt returned a genuine `SSL/TLS required`
# (SQLSTATE 28000), proving TCP reaches the real database. Render's own MCP query
# tool hits the same wall. Only the service itself can write to its database, so
# the runner's job is to ask it to.
#
# Required repository secret:
#   INGEST_TOKEN   matches INGEST_TOKEN on the Render service
#
# The token is passed as a query parameter, so it is kept out of the URL that
# gets echoed: curl reads it from a config file on stdin rather than argv.

on:
  workflow_dispatch:
    inputs:
      snowflake:
        description: "Snowflake path"
        type: choice
        default: "on"
        options:
          - "on"    # full pipeline: Snowflake MERGE -> stats -> Cortex -> Gemini
          - "off"   # local aggregation; cortex_findings gets the unavailable marker
  # Pushing anything to this branch runs an ingest. It exists because API tokens
  # without `actions: write` cannot fire workflow_dispatch, but can push.
  push:
    branches:
      - ops/run-ingest

  schedule:
    - cron: "0 0 * * *"

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BASE: https://pulse-atl.onrender.com
      SNOWFLAKE_MODE: ${{ inputs.snowflake || 'on' }}
    steps:
      - name: Check the token is configured
        run: |
          if [ -z "${{ secrets.INGEST_TOKEN }}" ]; then
            echo "::error::INGEST_TOKEN is not set; the endpoint would answer 401"
            exit 1
          fi

      - name: Record the current ingest timestamp
        id: before
        run: |
          health=$(curl -s --max-time 120 "$BASE/api/health" || echo '{}')
          echo "before=$(echo "$health" | python3 -c "import sys,json;print(json.load(sys.stdin).get('last_ingest') or 'none')" 2>/dev/null || echo 'none')" >> "$GITHUB_OUTPUT"
          echo "health before: $health"

      - name: Trigger the ingest
        env:
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
        run: |
          set -o pipefail
          query="token=$INGEST_TOKEN"
          if [ "$SNOWFLAKE_MODE" = "off" ]; then query="$query&snowflake=off"; fi

          # --config - reads the URL from stdin, so the token never appears in
          # argv (visible in `ps`) or in any command echo.
          printf 'url = "%s/api/admin/ingest?%s"\n' "$BASE" "$query" \
            | curl -s --max-time 300 --config - > response.json || true

          # The response carries no secrets: it is {ok, snowflake_skipped, counts}
          # or {ok:false, error} with credentials already redacted server-side.
          echo "response: $(cat response.json)"

          # An explicit {"ok":false} means the run already failed, so polling for
          # a timestamp that can never move would just burn the whole window and
          # then report a timeout instead of the actual cause.
          if python3 -c "import json,sys;sys.exit(0 if json.load(open('response.json')).get('ok') is False else 1)" 2>/dev/null; then
            echo "::error::ingest rejected the request: $(cat response.json)"
            exit 1
          fi

      - name: Confirm the cache actually advanced
        run: |
          # The endpoint answers 202 for runs over 20s, so a response alone does
          # not mean the ingest finished. Poll until last_ingest moves.
          #
          # The window is wall-clock rather than a fixed iteration count because
          # each health probe can itself take up to 60s, so counting iterations
          # makes the real deadline depend on how slow the service is that day.
          #
          # 15 minutes, not the 5 this used to allow: a full run makes ~25 Cortex
          # completions plus ~25 Gemini generations, and that only became true
          # once both models were unpinned from retired versions (#28, #30).
          # While both LLM calls were failing fast the pipeline finished in under
          # a minute, so the old window looked generous right up until the fixes
          # landed and run 172 timed out at 5m07s on an ingest that was still
          # working.
          before='${{ steps.before.outputs.before }}'
          started=$(date +%s)
          deadline=$(( started + 900 ))
          echo "waiting up to 15m for last_ingest to move from: $before"
          health='{}'
          while [ "$(date +%s)" -lt "$deadline" ]; do
            health=$(curl -s --max-time 60 "$BASE/api/health" || echo '{}')
            now=$(echo "$health" | python3 -c "import sys,json;print(json.load(sys.stdin).get('last_ingest') or 'none')" 2>/dev/null || echo 'none')
            rows=$(echo "$health" | python3 -c "import sys,json;print(json.load(sys.stdin).get('row_count','?'))" 2>/dev/null || echo '?')
            if [ "$now" != "$before" ] && [ "$now" != "none" ]; then
              elapsed=$(( $(date +%s) - started ))
              echo "::notice::ingest completed at $now ($rows rows, ${elapsed}s)"
              {
                echo "### Ingest complete"
                echo ""
                echo "Completed in ${elapsed}s."
                echo '```json'
                echo "$health"
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 15
          done
          elapsed=$(( $(date +%s) - started ))
          # Report what was actually seen; a bare timeout hides whether the
          # service was unreachable, empty, or merely slow.
          echo "::error::last_ingest never advanced past $before after ${elapsed}s"
          echo "last health payload: $health"
          exit 1
